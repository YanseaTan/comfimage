# Nginx 配置示例

本文件是 Comfimage 的 nginx 反向代理配置示例，用于 HTTPS 外网访问。

## 使用方法

1. 将此配置内容合并到你的 nginx.conf 的 `http` 块中
2. 修改证书路径为你的实际证书位置
3. 根据需要修改端口号
4. 执行 `nginx -s reload` 重新加载配置

## 配置内容

```nginx
# 限流配置
limit_req_zone $binary_remote_addr zone=one:10m rate=10r/s;

# HTTPS 服务配置
server {
    listen       8443 ssl;
    server_name  localhost;

    # 证书配置（替换为你的证书路径）
    ssl_certificate      /path/to/server.crt;
    ssl_certificate_key  /path/to/server.key;

    # SSL 优化配置
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;

    # Comfimage 反向代理
    location /comfimage/ {
        limit_req zone=one burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host:$server_port;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 600s;
        proxy_read_timeout 600s;
    }

    # 安全配置：禁止访问敏感目录
    # 注意：使用 ^/ 前缀，避免匹配到 /comfimage/ 等路径
    location ~ ^/(conf|logs|cert) {
        deny all;
    }

    # 默认页面
    location / {
        add_header Content-Type 'text/html; charset=utf-8';
        return 200 "<h1>HTTPS 服务运行中</h1>";
    }
}

# HTTP 重定向到 HTTPS
server {
    listen       80;
    server_name  localhost;
    return 301 https://$host:8443$request_uri;
}
```

## 启动命令

```bash
# 启动 Comfimage（必须指定 base_url 参数）
python scripts/run.py --base_url /comfimage
```

## 注意事项

1. **base_url 参数**：启动时必须指定 `--base_url /comfimage`，否则前端资源路径会错误
2. **正则安全规则**：`location ~ ^/(conf|logs|cert)` 必须使用 `^/` 前缀，否则会误匹配 `/comfimage/js/config.js` 等路径
3. **上传文件大小**：`client_max_body_size 100M` 用于支持大图片上传