<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfimage</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: white;
            --shadow: rgba(0,0,0,0.1);
            --border-color: #ccc;
            --button-bg: #007bff;
            --disabled-bg: #a0a0a0;
            --theme-icon: '☀️';
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
            --shadow: rgba(255,255,255,0.1);
            --border-color: #555;
            --button-bg: #007bff;
            --disabled-bg: #505050;
            --theme-icon: '🌙';
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); max-width: 600px; margin: 2rem auto; padding: 1rem; }
        h1, h2 { text-align: center; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        #user-info, #logout-link {
            display: none;
        }
        .title {
            text-align: left;
            margin: 0;
            font-family:'Times New Roman', Times, serif;
            font-style: italic;
        }
        .container { display: flex; flex-direction: column; gap: 2rem; }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 8px; box-shadow: 0 2px 10px var(--shadow); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box; /* 确保 padding 不会影响宽度 */
            font-family: inherit; /* 继承字体 */
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        /* 为 textarea 添加一些样式 */
        textarea {
            resize: vertical; /* 允许用户垂直调整大小 */
            min-height: 100px; /* 设置最小高度 */
        }
        .options-group { display: flex; gap: 1rem; }
        .options-group .form-group { flex: 1; }
        button { width: 100%; padding: 0.75rem; background-color: var(--button-bg); color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:disabled { background-color: var(--disabled-bg); cursor: not-allowed; }

        /* 进度条样式 */
        .progress-container {
            width: 100%;
            height: 48px; /* 与按钮高度匹配 */
            background-color: #e0e0e0; /* 浅色进度条背景 */
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: none;
        }
        [data-theme="dark"] .progress-container {
            background-color: #404040; /* 深色主题下的浅色背景 */
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--button-bg); /* 深色填充 */
            transition: width 0.3s ease;
            position: relative;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: bold;
        }
        #result-image { max-width: 100%; margin: 2rem auto 0; border-radius: 8px; display: none; cursor: pointer; }
        #loading { text-align: center; margin-top: 1rem; display: none; }

    /* 主题切换开关 */
        #theme-toggle {
            position: relative;
            width: 50px;
            height: 24px;
            background-color: var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s;
            border: none;
        }
        #theme-toggle::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
            z-index: 1;
        }
        #theme-toggle::after {
            content: var(--theme-icon);
            position: absolute;
            left: -30px;
            top: 2px;
            font-size: 16px;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        [data-theme="dark"] #theme-toggle {
            background-color: var(--button-bg);
        }
        [data-theme="dark"] #theme-toggle::before {
            transform: translateX(26px);
        }

        /* 全屏显示模态框 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; width: auto; max-width: 90%; max-height: 90%; position: relative; top: 50%; transform: translateY(-50%); }
        .close { position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; }
        .close:hover, .close:focus { color: #bbb; text-decoration: none; }
        .action-btn { position: absolute; top: 30px; color: #f1f1f1; font-size: 18px; cursor: pointer; padding: 5px; }
        .action-btn:hover { color: #bbb; }
        #copy-btn { right: 140px; }
        #download-btn { right: 90px; }

        /* 历史记录样式 */
        .history-item {
            border: 1px solid var(--border-color);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        /* 复制提示动画 */
        .copy-toast {
            background: rgba(0, 123, 255, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            position: absolute;
            z-index: 1001;
            opacity: 0;
            animation: fadeInOut 2s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10px); }
        }
    </style>
</head>
<body>
    <header class="header">
        <h1 class="title">Comfimage</h1>
        <div class="header-right">
            <button id="theme-toggle" title="切换主题"></button>
            <span id="user-info"></span>
            <a href="/logout" id="logout-link">登出</a>
        </div>
    </header>

    <!-- 登录表单 -->
    <div id="login-container" class="container">
        <div class="card">
            <h2>请登录</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">用户名:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码:</label>
                        <input type="password" id="login-password" name="password" required>
                    <div id="login-error" style="color: red; font-size: 0.9rem; margin-top: 0.5rem; display: none;"></div>
                </div>
                <button type="submit">登录</button>
            </form>
        </div>
    </div>

    <!-- 生图界面 -->
    <div id="main-container" class="container" style="display: none;">
        <div class="card">
            <form id="generate-form">
                <div class="form-group">
                    <label for="prompt">提示词:</label>
                    <!--
                      *** 关键改动在这里 ***
                      将 <input type="text"> 替换为了 <textarea>
                      - id, name, required 属性保持不变
                      - 增加了 rows 属性来控制默认显示的行数
                      - 默认文本放在标签之间
                    -->
                    <textarea id="prompt" name="prompt" rows="4" required>一只橘猫和一只虎斑狸花猫在草坪上玩耍</textarea>
                </div>

                <div class="options-group">
                    <div class="form-group">
                        <label for="width">宽度:</label>
                        <select id="width" name="width">
                            <option value="512">512</option>
                            <option value="768">768</option>
                            <option value="1024" selected>1024</option>
                            <option value="1280">1280</option>
                            <option value="1536">1536</option>
                            <option value="1792">1792</option>
                            <option value="2048">2048</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="height">高度:</label>
                        <select id="height" name="height">
                            <option value="512">512</option>
                            <option value="768">768</option>
                            <option value="1024" selected>1024</option>
                            <option value="1280">1280</option>
                            <option value="1536">1536</option>
                            <option value="1792">1792</option>
                            <option value="2048">2048</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="seed">种子:</label>
                    <input type="number" id="seed" name="seed" placeholder="留空则使用随机种子">
                </div>

                <button type="submit" id="generate-btn">生成图片</button>
                <div id="progress-container" class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                    <div id="progress-text" class="progress-text">0%</div>
                </div>
            </form>
            <div id="loading">正在生成中，请稍候...</div>
            <img id="result-image" src="" alt="Generated Image">
        </div>

        <div class="card">
            <h2>历史生成记录</h2>
            <div id="history-container"></div>
        </div>
    </div>

    <!-- 全屏图片模态框 -->
    <div id="image-modal" class="modal">
        <span class="close" id="close-modal">&times;</span>
        <span class="action-btn" id="copy-btn" title="复制图片">复制</span>
        <span class="action-btn" id="download-btn" title="下载图片">下载</span>
        <img class="modal-content" id="modal-image">
    </div>

    <script src="script.js"></script>
</body>
</html>
