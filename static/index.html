<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comfimage</title>
    <link rel="icon" href="favicon.ico">
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --card-bg: white;
            --shadow: rgba(0,0,0,0.1);
            --border-color: #ccc;
            --button-bg: #007bff;
            --disabled-bg: #a0a0a0;
            --theme-icon: '☀️';
        }

        [data-theme="dark"] {
            --bg-color: #1a1a1a;
            --text-color: #e0e0e0;
            --card-bg: #2a2a2a;
            --shadow: rgba(255,255,255,0.1);
            --border-color: #555;
            --button-bg: #007bff;
            --disabled-bg: #505050;
            --theme-icon: '🌙';
        }

        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); max-width: 600px; margin: 2rem auto; padding: 1rem; position: relative; }

        /* 动态彩虹渐变背景效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg,
                rgba(255, 200, 200, 0.8),
                rgba(255, 220, 180, 0.8),
                rgba(255, 255, 200, 0.8),
                rgba(200, 255, 200, 0.8),
                rgba(180, 255, 220, 0.8),
                rgba(200, 220, 255, 0.8),
                rgba(220, 200, 255, 0.8),
                rgba(255, 200, 220, 0.8)
            );
            background-size: 400% 400%;
            animation: rainbow 10s ease infinite;
            z-index: -1;
            opacity: 0.2;
        }

        @keyframes rainbow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        h1, h2 { text-align: center; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
        }
        .user-menu {
            position: relative;
            display: none;
        }
        .user-menu-toggle {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            background: transparent;
            color: var(--text-color);
            border: none;
            font-size: inherit;
        }
        .user-menu-toggle:hover {
            background: var(--shadow);
        }
        .user-menu-dropdown {
            display: none;
            position: absolute;
            top: 100%;
            right: 0;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 0 2px 10px var(--shadow);
            min-width: 150px;
            z-index: 1000;
        }
        .user-menu-dropdown.show {
            display: block;
        }
        .user-menu-item {
            display: block;
            padding: 0.75rem 1rem;
            color: var(--text-color);
            text-decoration: none;
            cursor: pointer;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-size: inherit;
        }
        .user-menu-item:hover {
            background: var(--shadow);
        }
        .user-menu-item:first-child {
            border-radius: 3px 3px 0 0;
        }
        .user-menu-item:last-child {
            border-radius: 0 0 3px 3px;
        }
        .title {
            text-align: left;
            margin: 0;
            width: 120px;
            height: auto;
        }
        .container { display: flex; flex-direction: column; gap: 2rem; }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 8px; box-shadow: 0 2px 10px var(--shadow); }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="password"], input[type="number"], select, textarea {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            box-sizing: border-box; /* 确保 padding 不会影响宽度 */
            font-family: inherit; /* 继承字体 */
            background-color: var(--card-bg);
            color: var(--text-color);
        }
        /* 为 textarea 添加一些样式 */
        textarea {
            resize: vertical; /* 允许用户垂直调整大小 */
            min-height: 100px; /* 设置最小高度 */
        }
        .options-group { display: flex; gap: 1rem; }
        .options-group .form-group { flex: 1; }
        button { width: 100%; padding: 0.75rem; background-color: var(--button-bg); color: white; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer; }
        button:disabled { background-color: var(--disabled-bg); cursor: not-allowed; }

        /* 进度条样式 */
        .progress-container {
            width: 100%;
            height: 48px; /* 与按钮高度匹配 */
            background-color: #e0e0e0; /* 浅色进度条背景 */
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            display: none;
        }
        [data-theme="dark"] .progress-container {
            background-color: #404040; /* 深色主题下的浅色背景 */
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: var(--button-bg); /* 深色填充 */
            transition: width 0.3s ease;
            position: relative;
        }
        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--text-color);
            font-size: 0.9rem;
            font-weight: bold;
        }
        #result-image { max-width: 100%; margin: 2rem auto 0; border-radius: 8px; display: none; cursor: pointer; }
        #loading { text-align: center; margin-top: 1rem; display: none; }

    /* 主题切换开关 */
        #theme-toggle {
            position: relative;
            width: 50px;
            height: 24px;
            background-color: var(--border-color);
            border-radius: 12px;
            cursor: pointer;
            transition: background-color 0.3s;
            border: none;
        }
        #theme-toggle::before {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            left: 2px;
            transition: transform 0.3s;
            z-index: 1;
        }
        #theme-toggle::after {
            content: var(--theme-icon);
            position: absolute;
            left: -30px;
            top: 2px;
            font-size: 16px;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }
        [data-theme="dark"] #theme-toggle {
            background-color: var(--button-bg);
        }
        [data-theme="dark"] #theme-toggle::before {
            transform: translateX(26px);
        }

        /* 全屏显示模态框 */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
        .modal-content { margin: auto; display: block; width: auto; max-width: 90%; max-height: 90%; position: relative; top: 50%; transform: translateY(-50%); }
        .close { position: absolute; top: 20px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; cursor: pointer; }
        .close:hover, .close:focus { color: #bbb; text-decoration: none; }
        .action-btn { position: absolute; top: 30px; color: #f1f1f1; font-size: 18px; cursor: pointer; padding: 5px; }
        .action-btn:hover { color: #bbb; }
        #copy-btn { right: 140px; }
        #download-btn { right: 90px; }

        /* 历史记录样式 */
        .history-item {
            border: 1px solid var(--border-color);
            padding: 1rem;
            margin-bottom: 1rem;
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        /* 复制提示动画 */
        .copy-toast {
            background: rgba(0, 123, 255, 0.9);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 14px;
            position: absolute;
            z-index: 1001;
            opacity: 0;
            animation: fadeInOut 2s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        /* 修改密码弹窗样式 */
        .change-password-modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .change-password-modal.show {
            display: flex;
        }
        .change-password-content {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow);
            max-width: 400px;
            width: 90%;
            position: relative;
        }
        .change-password-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: var(--text-color);
        }
        .change-password-close:hover {
            color: #999;
        }
    </style>
</head>
<body>
    <header class="header">
        <img src="{{base_path}}/static/title.png" alt="Comfimage" class="title">
        <div class="header-right">
            <button id="theme-toggle" title="切换主题"></button>
            <div class="user-menu" id="user-menu">
                <button class="user-menu-toggle" id="user-menu-toggle">
                    <span id="user-info"></span>
                    <span>▼</span>
                </button>
                <div class="user-menu-dropdown" id="user-menu-dropdown">
                    <button class="user-menu-item" id="change-password-btn">修改密码</button>
                    <button class="user-menu-item" id="logout-btn">退出登录</button>
                </div>
            </div>
        </div>
    </header>

    <!-- 登录表单 -->
    <div id="login-container" class="container">
        <div class="card">
            <h2>请登录</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="username">用户名:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="login-password">密码:</label>
                    <input type="password" id="login-password" name="password" required>
                    <div id="login-error" style="color: red; font-size: 0.9rem; margin-top: 0.5rem; display: none;"></div>
                </div>
                <button type="submit">登录</button>
            </form>
        </div>
    </div>

    <!-- 生图界面 -->
    <div id="main-container" class="container" style="display: none;">
        <div class="card">
            <form id="generate-form">
                <div class="form-group">
                    <label for="prompt">提示词:</label>
                    <textarea id="prompt" name="prompt" rows="4" required>一只橘猫和一只虎斑狸花猫在草坪上玩耍</textarea>
                </div>

                <div class="options-group">
                    <div class="form-group">
                        <label for="width">宽度:</label>
                        <select id="width" name="width">
                            <option value="512">512</option>
                            <option value="768">768</option>
                            <option value="1024" selected>1024</option>
                            <option value="1280">1280</option>
                            <option value="1536">1536</option>
                            <option value="1792">1792</option>
                            <option value="2048">2048</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="height">高度:</label>
                        <select id="height" name="height">
                            <option value="512">512</option>
                            <option value="768">768</option>
                            <option value="1024" selected>1024</option>
                            <option value="1280">1280</option>
                            <option value="1536">1536</option>
                            <option value="1792">1792</option>
                            <option value="2048">2048</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="seed">种子:</label>
                    <input type="number" id="seed" name="seed" placeholder="留空则使用随机种子">
                </div>

                <button type="submit" id="generate-btn">生成图片</button>
                <div id="progress-container" class="progress-container">
                    <div id="progress-bar" class="progress-bar"></div>
                    <div id="progress-text" class="progress-text">0%</div>
                </div>
            </form>
            <div id="loading">正在生成中，请稍候...</div>
            <img id="result-image" src="" alt="Generated Image">
        </div>

        <div class="card">
            <h2>历史生成记录</h2>
            <div id="history-container"></div>
        </div>
    </div>

    <!-- 全屏图片模态框 -->
    <div id="image-modal" class="modal">
        <span class="close" id="close-modal">&times;</span>
        <span class="action-btn" id="copy-btn" title="复制图片">复制</span>
        <span class="action-btn" id="download-btn" title="下载图片">下载</span>
        <img class="modal-content" id="modal-image">
    </div>

    <!-- 修改密码弹窗 -->
    <div id="change-password-modal" class="change-password-modal">
        <div class="change-password-content">
            <span class="change-password-close" id="change-password-close">&times;</span>
            <h2 style="margin-top: 0;">修改密码</h2>
            <form id="change-password-form">
                <div class="form-group">
                    <label for="old-password">当前密码:</label>
                    <input type="password" id="old-password" name="old_password" required>
                </div>
                <div class="form-group">
                    <label for="new-password">新密码:</label>
                    <input type="password" id="new-password" name="new_password" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">确认新密码:</label>
                    <input type="password" id="confirm-password" name="confirm_password" required>
                </div>
                <div id="change-password-error" style="color: red; font-size: 0.9rem; margin-bottom: 1rem; display: none;"></div>
                <button type="submit">修改密码</button>
            </form>
        </div>
    </div>

    <script>
        // 动态注入base路径
        window.BASE_PATH = '{{base_path}}';
    </script>
    <script src="script.js"></script>
</body>
</html>
